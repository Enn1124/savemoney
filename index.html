<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>안 사기 계좌</title>
<style>
:root{--paper:#fff;--bg:#eceff4;--ink:#0f172a;--muted:#64748b;--faint:#94a3b8;--line:#e2e8f0;--line2:#cbd5e1;--ok:#059669;--ok-soft:#ecfdf5;--bad:#e11d48;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--faint);flex:none}.dot.live{background:var(--ok)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.who img{width:24px;height:24px;border-radius:99px}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;transition:background .15s;white-space:nowrap}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#334155}
.btn-line{border:1px solid var(--line);background:var(--paper);color:var(--muted)}.btn-line:hover{background:#f8fafc}
.btn-wide{width:100%;padding:12px;font-size:14px;border-radius:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px}
.panel-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.total{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(30px,8vw,56px);font-weight:700;letter-spacing:-.03em;margin:6px 0 2px}
.sub{margin:0;font-size:13px;color:var(--muted)}
.goalrow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:26px;gap:12px}
.bar{height:12px;border-radius:99px;background:#f1f5f9;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.left{margin:8px 0 0;font-family:var(--mono);font-size:11px;color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin-top:24px}
.stat{background:var(--paper);padding:12px 6px;text-align:center}.stat p{margin:0}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;margin-top:3px}
.cols{display:grid;grid-template-columns:1fr;gap:22px;margin-top:22px;align-items:start}
@media(min-width:940px){.cols{grid-template-columns:1.55fr 1fr}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:#f8fafc}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .sw{width:8px;height:8px;border-radius:99px;flex:none}.chip.manage{border-style:dashed}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;height:132px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img.full{width:100%;height:100%;object-fit:cover}.thumb img.ico{width:44px;height:44px;object-fit:contain}
.thumb .ph{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.15em}
.badge{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;border-radius:99px;padding:3px 8px;font-family:var(--mono);font-size:10px;font-weight:700}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card:hover .tools,.card:focus-within .tools{opacity:1}
.tool{background:rgba(255,255,255,.94);border-radius:99px;width:26px;height:26px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.tool:hover{color:var(--ink)}.tool.del:hover{color:var(--bad)}
.cbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cname{margin:0;font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cprice{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tag{border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600}
.host{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--faint);align-self:flex-start}
.empty{border:1px dashed var(--line2);border-radius:var(--r);background:var(--paper);padding:40px 20px;text-align:center}
.empty p{margin:0 0 4px}.et{font-size:14px;font-weight:600}.ed{font-size:12px;color:var(--muted);margin-bottom:16px}
.receipt{background:var(--paper);border-radius:10px 10px 0 0;padding:22px 20px 8px}
.r-title{text-align:center;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.3em;margin:0}
.r-sub{text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);margin:4px 0 0}
.tear{border-top:1px dashed var(--line2);margin:14px 0}
.lines{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto}
.rl{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-family:var(--mono);font-size:12px}
.rl .rd{color:var(--faint);flex:none}.rl .rn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl .ru{opacity:0;color:var(--faint);font-size:11px;flex:none}.rl:hover .ru,.rl:focus-within .ru{opacity:1}.rl .ru:hover{color:var(--bad)}
.rl .rp{font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.r-total{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;font-weight:700}
.r-foot{text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);margin:12px 0 0}
.zig{display:block;width:100%;height:12px}
.brk{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.brk-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;margin-top:10px}
.brk-row .lbl{font-size:12px;font-weight:600}.brk-row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.brk-bar{grid-column:1/-1;height:6px;border-radius:99px;background:#f1f5f9;overflow:hidden}.brk-bar span{display:block;height:100%;border-radius:99px}
.veil{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.42);display:flex;align-items:flex-end;justify-content:center;padding:14px}
@media(min-width:560px){.veil{align-items:center}}
.modal{position:relative;background:var(--paper);border-radius:18px;width:100%;max-width:480px;padding:24px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:640px}
.modal .x{position:absolute;right:14px;top:12px;color:var(--faint);font-size:18px;line-height:1}.modal .x:hover{color:var(--ink)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;background:#fff}
.in:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.in.mono{font-family:var(--mono)}.irow{display:flex;gap:8px}.irow .in{flex:1}
.pv{display:flex;gap:12px;align-items:center;background:#f8fafc;border-radius:10px;padding:10px;margin-top:10px}
.pv .box{width:54px;height:54px;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.pv .box img{max-width:100%;max-height:100%;object-fit:cover}.pv small{display:block;font-size:11px;color:var(--faint)}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:24px}.actions .btn{flex:1;padding:11px;border-radius:11px;font-size:14px}
.term{text-align:center}
.tamt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:38px;font-weight:700;margin:4px 0 0}
.hold{position:relative;width:100%;overflow:hidden;border-radius:12px;background:var(--ink);color:#fff;padding:15px;font-size:14px;font-weight:700;margin-top:22px;touch-action:none;user-select:none}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok)}.hold .lb{position:relative}
.stamp{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ok);color:var(--ok);border-radius:9px;padding:8px 16px;font-family:var(--mono);font-weight:700;letter-spacing:.2em;transform:rotate(-7deg);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:rotate(-7deg) scale(.6);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.gate{max-width:400px;margin:10vh auto;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:34px 26px}
.gate h1{font-size:20px;margin:14px 0 6px}.gate p{font-size:13px;color:var(--muted);margin:0 0 22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line2);border-radius:12px;padding:12px;font-size:14px;font-weight:600;background:#fff;margin-bottom:10px}
.gbtn:hover{background:#f8fafc}
.setup{max-width:500px;margin:6vh auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px}
.setup h1{font-size:18px;margin:10px 0 6px}
.setup .desc{font-size:13px;color:var(--muted);margin:0 0 6px;line-height:1.7}
.hint{font-size:12px;color:var(--muted);background:#f8fafc;border-radius:10px;padding:12px 14px;line-height:1.8;margin:10px 0 0}
.hint b{color:var(--ink)}.hint code{font-family:var(--mono);background:var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
.paste-area{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px;min-height:140px;resize:vertical;background:#f8fafc;margin-top:6px}
.paste-area:focus{outline:2px solid var(--ink);border-color:transparent;background:#fff}
.setup-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.setup-actions .btn{flex:1;padding:11px;border-radius:11px;font-size:14px;min-width:120px}
/* 리포트 */
.rpt-nav{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.rpt-nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:14px;display:grid;place-items:center}
.rpt-nav button:hover{background:#f8fafc}.rpt-nav button:disabled{opacity:.3;cursor:default}
.rpt-nav .ml{font-family:var(--mono);font-size:14px;font-weight:700;min-width:80px;text-align:center}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:440px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#f8fafc;border-radius:12px;padding:14px 10px;text-align:center}
.kpi .kv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;margin:4px 0 0}
.kpi .kk{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.insight{background:var(--ok-soft);border:1px solid #a7f3d0;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.75;color:#065f46;margin-top:14px}
.insight strong{color:#047857}
.rpt-sec{margin-top:22px}
.rpt-sec h3{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
.rbar-row{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:8px;margin-bottom:8px}
.rbar-row .rl2{font-size:12px;font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar-row .rb{height:8px;border-radius:99px;background:#f1f5f9;overflow:hidden}.rbar-row .rb span{display:block;height:100%;border-radius:99px}
.rbar-row .ra{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ti{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.ti:last-child{border-bottom:0}
.ti .tn{font-family:var(--mono);font-size:11px;color:var(--faint);width:18px;flex:none}
.ti .tm{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .tc{font-size:11px;color:var(--muted)}.ti .tp{font-family:var(--mono);font-size:12px;font-weight:700;flex:none}
.nodata{text-align:center;padding:40px 0;font-size:13px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;font-size:12px;z-index:60;box-shadow:0 8px 24px rgba(15,23,42,.22);white-space:nowrap}
.foot{text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:36px}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script type="module">
const HOLD_MS=1200;
const PALETTE=["#e11d48","#ea580c","#ca8a04","#059669","#0891b2","#4f46e5","#9333ea","#64748b"];
const STARTER=[{id:"t_clothes",name:"옷",color:"#4f46e5"},{id:"t_food",name:"음식",color:"#ea580c"},{id:"t_movie",name:"영화",color:"#9333ea"},{id:"t_tech",name:"전자기기",color:"#0891b2"}];
const LS_CFG="nobuy:fbconfig", LS_DAT="nobuy:v2";

const won=n=>"₩"+new Intl.NumberFormat("ko-KR").format(Math.round(n||0));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dkey=t=>new Date(t).toISOString().slice(0,10);
const mkey=t=>new Date(t).toISOString().slice(0,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const blank=()=>({goal:{amount:1000000,label:""},tags:STARTER.slice(),items:[],logs:[]});

let state=blank(),filter=null,user=null,mode="local",synced=false,toastTmr=null;
let reportYM=new Date().toISOString().slice(0,7);
let fb=null,saveTmr=null,unsub=null;

/* ── Firebase ── */
const loadCfg=()=>{try{return JSON.parse(localStorage.getItem(LS_CFG)||"null");}catch{return null;}};
const saveCfg=c=>localStorage.setItem(LS_CFG,JSON.stringify(c));

async function initFB(cfg){
  if(!cfg?.apiKey)return null;
  try{
    const[app,auth,fs]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
    ]);
    const a=app.initializeApp(cfg);
    return{a,auth,fs,authInst:auth.getAuth(a),db:fs.getFirestore(a)};
  }catch(e){console.error(e);return null;}
}

function watchCloud(){
  const{fs,db}=fb,ref=fs.doc(db,"savers",user.uid);
  unsub=fs.onSnapshot(ref,snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists()){const d=snap.data();state={goal:d.goal||blank().goal,tags:d.tags||[],items:d.items||[],logs:d.logs||[]};}
    else queueSave();
    synced=true;render();
  },()=>toast("동기화가 끊겼습니다."));
}

function queueSave(){
  clearTimeout(saveTmr);
  saveTmr=setTimeout(async()=>{
    const p={...state,updatedAt:Date.now()};
    if(mode==="cloud"&&user){try{await fb.fs.setDoc(fb.fs.doc(fb.db,"savers",user.uid),p);}catch{toast("저장하지 못했습니다.");}}
    else{try{localStorage.setItem(LS_DAT,JSON.stringify(p));}catch{}}
  },400);
}
function loadLocal(){try{const r=localStorage.getItem(LS_DAT);if(r)state={...blank(),...JSON.parse(r)};}catch{}}

/* ── 미리보기 ── */
async function fetchPreview(raw){
  let u;try{u=new URL(raw.startsWith("http")?raw:"https://"+raw);}catch{return null;}
  const host=u.hostname.replace(/^www\./,"");
  const fav=`https://www.google.com/s2/favicons?domain=${host}&sz=128`;
  try{
    const r=await fetch("https://api.microlink.io/?url="+encodeURIComponent(u.href));
    if(r.ok){const j=await r.json();const img=j?.data?.image?.url||j?.data?.logo?.url;
      if(img)return{url:u.href,host,image:img,title:j?.data?.title||"",exact:true};
      return{url:u.href,host,image:fav,title:j?.data?.title||"",exact:false};}
  }catch{}
  return{url:u.href,host,image:fav,title:"",exact:false};
}
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,420/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72));};im.onerror=()=>rej();im.src=fr.result;};
    fr.onerror=()=>rej();fr.readAsDataURL(file);
  });
}

/* ── 계산 ── */
const tagById=id=>state.tags.find(t=>t.id===id);
const total=()=>state.logs.reduce((s,l)=>s+l.price,0);

function stats(){
  const mk=new Date().toISOString().slice(0,7);
  const month=state.logs.filter(l=>dkey(l.at).startsWith(mk)).reduce((s,l)=>s+l.price,0);
  const days=new Set(state.logs.map(l=>dkey(l.at)));
  const c=new Date();let streak=0;
  if(!days.has(dkey(c)))c.setDate(c.getDate()-1);
  while(days.has(dkey(c))){streak++;c.setDate(c.getDate()-1);}
  return{month,streak,count:state.logs.length};
}

function byTag(logs){
  const m=new Map();
  for(const l of logs){const ids=(l.tags&&l.tags.length)?l.tags:["__none"];for(const id of ids)m.set(id,(m.get(id)||0)+l.price);}
  return[...m.entries()].map(([id,sum])=>{const t=id==="__none"?{name:"태그 없음",color:"#cbd5e1"}:tagById(id);return t?{name:t.name,color:t.color,sum}:null;}).filter(Boolean).sort((a,b)=>b.sum-a.sum);
}

function reportData(ym){
  const logs=state.logs.filter(l=>mkey(l.at)===ym);
  if(!logs.length)return null;
  const tot=logs.reduce((s,l)=>s+l.price,0);
  const days=new Set(logs.map(l=>dkey(l.at))).size;
  const tagRows=byTag(logs);
  const itemMap=new Map();
  for(const l of logs){if(!l.itemId)continue;const e=itemMap.get(l.itemId)||{name:l.name,count:0,sum:0};e.count++;e.sum+=l.price;itemMap.set(l.itemId,e);}
  const topItems=[...itemMap.values()].sort((a,b)=>b.count-a.count).slice(0,5);
  const topTag=tagRows[0],topItem=topItems[0];
  let insight=`이번 달 총 <strong>${won(tot)}</strong>을 참았습니다. `;
  if(topTag)insight+=`가장 많이 참은 카테고리는 <strong>${esc(topTag.name)}</strong>으로 ${Math.round(topTag.sum/tot*100)}%를 차지합니다. `;
  if(topItem)insight+=`<strong>${esc(topItem.name)}</strong>을(를) ${topItem.count}번 참았습니다. `;
  insight+=`참은 날 하루 평균 <strong>${won(Math.round(tot/days))}</strong>씩 절약했습니다.`;
  return{tot,days,count:logs.length,tagRows,topItems,insight};
}

/* ── 모달 ── */
function modal(inner,wide){
  closeModal();
  const v=document.createElement("div");v.className="veil";
  v.innerHTML=`<div class="modal${wide?" wide":""}" role="dialog" aria-modal="true"><button class="x" data-close>✕</button>${inner}</div>`;
  document.body.appendChild(v);
  const close=()=>{v.remove();document.removeEventListener("keydown",key);};
  const key=e=>{if(e.key==="Escape")close();};
  document.addEventListener("keydown",key);
  v.addEventListener("click",e=>{if(e.target===v||e.target.hasAttribute("data-close"))close();});
  v._close=close;return{el:v.firstElementChild,close};
}
function closeModal(){document.querySelectorAll(".veil").forEach(v=>v._close?v._close():v.remove());}

function payDialog(item){
  const m=modal(`<div class="term"><p class="eyebrow">카드 단말기</p><p style="font-size:13px;color:var(--muted);margin:12px 0 0">${esc(item.name)}</p><p class="tamt">${won(item.price)}</p><div id="p-zone"><button class="hold" id="p-hold"><span class="fill"></span><span class="lb">길게 눌러 결제</span></button><p style="font-size:12px;color:var(--muted);margin:12px 0 0">끝까지 누르고 있으면 승인됩니다. 돈은 빠져나가지 않습니다.</p><button class="btn" data-close style="color:var(--faint);font-size:12px;text-decoration:underline;margin-top:12px">그만두기</button></div></div>`);
  const hold=m.el.querySelector("#p-hold"),fill=hold.querySelector(".fill"),label=hold.querySelector(".lb");
  let raf=null,t0=0;
  const stop=()=>{if(raf){cancelAnimationFrame(raf);raf=null;fill.style.width="0%";label.textContent="길게 눌러 결제";}};
  const tick=t=>{const p=Math.min(1,(t-t0)/HOLD_MS);fill.style.width=(p*100)+"%";label.textContent="승인 중…";if(p>=1){raf=null;done();}else raf=requestAnimationFrame(tick);};
  const start=()=>{if(raf)return;t0=performance.now();raf=requestAnimationFrame(tick);};
  const done=()=>{
    item.resisted=(item.resisted||0)+1;
    state.logs.unshift({id:uid(),itemId:item.id,name:item.name,price:item.price,tags:[...(item.tags||[])],at:Date.now()});
    queueSave();
    m.el.querySelector("#p-zone").innerHTML=`<div style="margin-top:22px"><span class="stamp">✓ 출금 없음</span><p style="font-size:14px;font-weight:600;margin:18px 0 0">${won(item.price)}이 계좌에 남았습니다.</p><p style="font-size:12px;color:var(--muted);margin:4px 0 0">영수증에 인쇄했습니다.</p></div>`;
    setTimeout(()=>{m.close();render();},1500);
  };
  hold.addEventListener("pointerdown",start);hold.addEventListener("pointerup",stop);
  hold.addEventListener("pointerleave",stop);hold.addEventListener("pointercancel",stop);
  hold.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();start();}});hold.addEventListener("keyup",stop);
}

/* ── 월별 리포트 ── */
function reportDialog(){
  const months=[...new Set(state.logs.map(l=>mkey(l.at)))].sort().reverse();
  if(!months.length){toast("아직 기록이 없습니다. 결제 버튼을 한 번 눌러 보세요.");return;}
  if(!months.includes(reportYM))reportYM=months[0];

  const drawBody=ym=>{
    const d=reportData(ym);
    if(!d)return`<div class="nodata">이 달에는 기록이 없습니다.</div>`;
    const [yr,mo]=ym.split("-");
    const tagMax=d.tagRows[0]?.sum||1;
    return`<div class="kpi-grid">
  <div class="kpi"><p class="kk">절약 총액</p><p class="kv" style="font-size:15px">${won(d.tot)}</p></div>
  <div class="kpi"><p class="kk">참은 횟수</p><p class="kv">${d.count}회</p></div>
  <div class="kpi"><p class="kk">참은 날</p><p class="kv">${d.days}일</p></div>
  <div class="kpi"><p class="kk">일평균</p><p class="kv" style="font-size:15px">${won(Math.round(d.tot/d.days))}</p></div>
</div>
<div class="insight">${d.insight}</div>
<div class="rpt-sec"><h3>카테고리별 절약</h3>${d.tagRows.length?d.tagRows.map(r=>`<div class="rbar-row"><span class="rl2" style="color:${r.color}">${esc(r.name)}</span><div class="rb"><span style="width:${r.sum/tagMax*100}%;background:${r.color}"></span></div><span class="ra">${won(r.sum)}</span></div>`).join(""):`<p style="font-size:13px;color:var(--faint)">태그가 없습니다.</p>`}</div>
<div class="rpt-sec"><h3>가장 많이 참은 항목 TOP 5</h3>${d.topItems.length?d.topItems.map((it,i)=>`<div class="ti"><span class="tn">${i+1}</span><span class="tm">${esc(it.name)}</span><span class="tc">${it.count}번</span><span class="tp">${won(it.sum)}</span></div>`).join(""):`<p style="font-size:13px;color:var(--faint)">항목 정보가 없습니다.</p>`}</div>`;
  };

  const m=modal(`<p class="eyebrow">월별 소비 리포트</p>
<div class="rpt-nav" id="rnav">
  <button id="r-prev">◀</button>
  <span class="ml" id="r-mlabel"></span>
  <button id="r-next">▶</button>
</div>
<div id="r-body"></div>`,true);

  const refresh=()=>{
    const[yr,mo]=reportYM.split("-");
    m.el.querySelector("#r-mlabel").textContent=`${yr}년 ${mo}월`;
    const idx=months.indexOf(reportYM);
    m.el.querySelector("#r-prev").disabled=idx>=months.length-1;
    m.el.querySelector("#r-next").disabled=idx<=0;
    m.el.querySelector("#r-body").innerHTML=drawBody(reportYM);
  };
  refresh();
  m.el.querySelector("#r-prev").addEventListener("click",()=>{const i=months.indexOf(reportYM);if(i<months.length-1){reportYM=months[i+1];refresh();}});
  m.el.querySelector("#r-next").addEventListener("click",()=>{const i=months.indexOf(reportYM);if(i>0){reportYM=months[i-1];refresh();}});
}

/* ── Firebase 설정 파싱 ── */
function parseCfg(text){
  try{
    const m=text.match(/\{[\s\S]*\}/);if(!m)return null;
    const c=m[0].replace(/\/\/.*$/gm,"").replace(/,\s*\}/,"}").replace(/([{,]\s*)([a-zA-Z_$][a-zA-Z0-9_$]*)\s*:/g,'$1"$2":');
    return JSON.parse(c);
  }catch{return null;}
}

/* ── 이벤트 ── */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.dataset.id;
  switch(b.dataset.act){
    case "add":     itemDialog(null);break;
    case "edit":    itemDialog(state.items.find(i=>i.id===id));break;
    case "del":{const i=state.items.find(x=>x.id===id);if(i&&confirm(`"${i.name}"을(를) 목록에서 지울까요?`)){state.items=state.items.filter(x=>x.id!==id);queueSave();render();}break;}
    case "pay":     payDialog(state.items.find(i=>i.id===id));break;
    case "filter":  filter=id||null;render();break;
    case "tags":    tagDialog();break;
    case "goal":    goalDialog();break;
    case "report":  reportDialog();break;
    case "blocked": toast("링크는 열리지 않습니다. 지금은 참는 중이니까요.");break;
    case "undo":{const l=state.logs.find(x=>x.id===id);if(!l)return;state.logs=state.logs.filter(x=>x.id!==id);const it=state.items.find(x=>x.id===l.itemId);if(it)it.resisted=Math.max(0,(it.resisted||0)-1);queueSave();render();toast("기록을 지웠습니다.");break;}
    case "signin":  signIn();break;
    case "signout": fb.auth.signOut(fb.authInst);break;
    case "configure": mode="setup";render();break;
    case "setup-skip": mode="local";loadLocal();render();break;
    case "setup-save":{
      const raw=$("#cfg-paste").value;
      const cfg=parseCfg(raw);
      if(!cfg?.apiKey){const el=$("#cfg-err");el.style.display="block";el.textContent="설정 코드를 읽지 못했습니다. const firebaseConfig = { … } 부분 전체를 복사해 주세요.";return;}
      saveCfg(cfg);toast("Firebase에 연결하는 중…");
      fb=await initFB(cfg);
      if(!fb){toast("Firebase에 연결하지 못했습니다. apiKey를 확인해 주세요.");return;}
      mode="cloud";
      fb.auth.onAuthStateChanged(fb.authInst,u=>{if(unsub){unsub();unsub=null;}user=u;if(u){synced=false;state=blank();watchCloud();}render();});
      render();break;
    }
  }
});

function toast(msg){$(".toast")?.remove();const d=document.createElement("div");d.className="toast";d.role="status";d.textContent=msg;document.body.appendChild(d);clearTimeout(toastTmr);toastTmr=setTimeout(()=>d.remove(),2600);}

async function signIn(){
  try{await fb.auth.signInWithPopup(fb.authInst,new fb.auth.GoogleAuthProvider());}
  catch(err){if(String(err?.code).includes("popup"))fb.auth.signInWithRedirect(fb.authInst,new fb.auth.GoogleAuthProvider());else toast("로그인하지 못했습니다. 다시 시도해 주세요.");}
}

/* ── 시작 ── */
(async()=>{
  const cfg=loadCfg();
  if(cfg?.apiKey){
    fb=await initFB(cfg);
    if(fb){mode="cloud";fb.auth.onAuthStateChanged(fb.authInst,u=>{if(unsub){unsub();unsub=null;}user=u;if(u){synced=false;state=blank();watchCloud();}render();});render();return;}
  }
  if(!cfg){mode="setup";render();}
  else{mode="local";loadLocal();render();}
})();
</script>
</body>
</html>
